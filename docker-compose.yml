services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db/init-platform.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  emqx:
    image: emqx/emqx:5.8
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    networks:
      - backend

  uns-manager:
    build: ./services/uns-manager
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${UNS_MANAGER_HOST_PORT:-8002}:8002"
    networks:
      - backend

  sync-service:
    build: ./services/sync-service
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge
